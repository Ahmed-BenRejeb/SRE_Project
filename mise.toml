# Tool versions for Tier-0. Run `mise install` in this directory.
# Versions below match what was installed on 2026-10-19 (k3d/kubectl/helm/argocd/k9s/stern/
# just/jq/uv/golangci-lint/go/duckdb/oha) or the latest in the mise registry (ctlptl/tilt/yq/ruff).
# Bump deliberately, not by accident.

[tools]
# cluster + GitOps
k3d = "5.8.3"
ctlptl = "0.9.6"
kubectl = "1.36.2"
helm = "4.2.2"
argocd = "3.4.2"
k9s = "0.51.0"
stern = "1.34.0"
tilt = "0.37.8"

# build + dev
just = "1.57.0"
go = "1.26.5"
golangci-lint = "2.12.2"
uv = "0.11.23"
ruff = "0.17.1"

# data wrangling
jq = "1.8.2"
yq = "4.54.1"
duckdb = "1.5.5"
oha = "1.15.0"

# Not pinned here:
#  - gopls, delve: install with `go install` (or add via the mise `go:` backend later).
#  - mise itself, direnv, docker: system-level, installed with pacman.
#  - Arc 1+ tools (rpk, mc, toxiproxy, pgcli, k6): add when the ticket needs them.
