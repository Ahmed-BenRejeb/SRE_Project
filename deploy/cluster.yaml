apiVersion: ctlptl.dev/v1alpha1
kind: Registry
name: ctlptl-registry
port: 5005
---
apiVersion: ctlptl.dev/v1alpha1
kind: Cluster
name: k3d-dev
product: k3d
registry: ctlptl-registry
k3d:
  v1alpha5Simple:
    servers: 1
    agents: 3
    options:
      k3s:
        extraArgs:
          - arg: --disable=traefik
            nodeFilters: ["server:*"]
          - arg: --disable=servicelb
            nodeFilters: ["server:*"]
